# Price Pulse - shared settings (safe to commit: NO secrets here)
spring.application.name=price-pulse

# Personal values (DB password, JWT secret, admin login) come from environment variables,
# or from application-local.properties in this folder (git-ignored). See application-example.properties.
spring.config.import=optional:classpath:application-local.properties

server.port=8080
# Never send stack traces or exception details to the client (FR-40)
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pricepulse?serverTimezone=UTC}
spring.datasource.username=${DB_USER:pricepulse_app}
spring.datasource.password=${DB_PASSWORD:}

# database/schema.sql creates the tables. Hibernate only CHECKS that the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# All times are stored in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Login ----------
# FR-04: token valid for 24 hours. The secret is never committed.
pricepulse.jwt.secret=${JWT_SECRET:}
pricepulse.jwt.expiration-hours=24

# The Admin account is created at startup if it does not exist yet (SRS 2.2: no public admin sign-up).
pricepulse.admin.name=${ADMIN_NAME:Price Pulse Admin}
pricepulse.admin.email=${ADMIN_EMAIL:}
pricepulse.admin.password=${ADMIN_PASSWORD:}

# ---------- Rule thresholds (SRS 3.2 and 3.3, SDS 4). Tune here, never in Java code. ----------
# FR-13: an observation that differs by more than this from the last accepted price is FLAGGED
pricepulse.rules.flag-change-percent=60
# FR-12: same user + same product within this window is ignored
pricepulse.rules.duplicate-window-hours=6
# FR-10: prices above this are rejected
pricepulse.rules.max-price=10000000
# FR-15: enough data = at least this many accepted observations spread over at least this many days
pricepulse.rules.min-observations=3
pricepulse.rules.min-history-days=7
# FR-16: claimed original more than margin-percent above the highest price of the lookback period
pricepulse.rules.inflated-lookback-days=60
pricepulse.rules.inflated-margin-percent=10
# FR-17: rise of at least hike-percent within hike-window-days before the sale price appeared
pricepulse.rules.hike-percent=15
pricepulse.rules.hike-window-days=14
# FR-18: badge in at least ratio-percent of at least min-observations, over the lookback period
pricepulse.rules.perpetual-lookback-days=30
pricepulse.rules.perpetual-min-observations=5
pricepulse.rules.perpetual-ratio-percent=80
# FR-21: real discount is measured against the median of this many days
pricepulse.rules.median-days=30
# FR-26: maximum watchlist size
pricepulse.rules.watchlist-limit=20
# SDS Figure 4: PercentageDropAlertRule also alerts when the price falls this much at once
pricepulse.rules.alert-drop-percent=20
