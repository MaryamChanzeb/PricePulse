<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEMO Smart Watch X2 - Demo Store</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="demo-banner">DEMO STORE - for the Price Pulse class demonstration only. Not a real shop; prices are made up (DEMO DATA).</div>
  <header class="shop-header"><a href="index.html">Demo Store</a></header>
  <main class="product" data-product-sku="demo-inflated">
    <div class="product-image">product image</div>
    <div class="product-info">
      <h1 class="product-title">DEMO Smart Watch X2</h1>
      <div class="price-box">
        <span class="price-now">Rs. 5,999</span>
        <span class="price-was">Rs. 9,999</span>
        <span class="discount-badge">-40%</span>
      </div>
      <button type="button" class="cart-button" disabled>Add to cart</button>
    </div>
  </main>
</body>
</html>
