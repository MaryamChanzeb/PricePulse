# EXAMPLE ONLY - copy this file to application-local.properties (same folder) and put your own values in it.
# application-local.properties is in .gitignore, so your real passwords never reach GitHub.
# Instead of this file you can set environment variables:
#   DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD (and optionally ADMIN_NAME).

spring.datasource.url=jdbc:mysql://localhost:3306/pricepulse?serverTimezone=UTC
spring.datasource.username=pricepulse_app
spring.datasource.password=CHANGE_ME_DB_PASSWORD

# At least 32 random characters. Each member makes her own.
pricepulse.jwt.secret=CHANGE_ME_AT_LEAST_32_RANDOM_CHARACTERS

# The admin account created when the server starts (only if that email does not exist yet).
# Password: at least 8 characters and one digit.
pricepulse.admin.email=CHANGE_ME_admin@example.com
pricepulse.admin.password=CHANGE_ME_Admin12345

# Rule thresholds live in application.properties; override them here only while experimenting, e.g.
# pricepulse.rules.flag-change-percent=60
